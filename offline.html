<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Can't Reach Site | Sufal K.C.</title>
    <meta name="robots" content="noindex">
    <script>
        try { document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark'); } catch (e) {}
    </script>
    <!-- Fully self-contained (no external CSS/fonts) so it works with no connection -->
    <style>
        :root {
            --bg: #0d0d0d; --card: #1a1a1a; --text: #ffffff; --muted: #a3a3a3;
            --border: #333333; --btn-bg: #ffffff; --btn-text: #000000; --accent: #f59e0b;
        }
        [data-theme="light"] {
            --bg: #f7f7f8; --card: #ffffff; --text: #111113; --muted: #52525b;
            --border: #e4e4e7; --btn-bg: #111113; --btn-text: #ffffff; --accent: #d97706;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .card {
            max-width: 440px;
            width: 100%;
            text-align: center;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px 28px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
        }
        .icon {
            width: 72px; height: 72px;
            margin: 0 auto 20px;
            border-radius: 50%;
            display: grid; place-items: center;
            background: color-mix(in srgb, var(--accent) 15%, transparent);
            color: var(--accent);
        }
        .icon svg { width: 36px; height: 36px; }
        h1 { font-size: 1.5rem; margin-bottom: 10px; }
        p { color: var(--muted); line-height: 1.6; }
        .actions { margin-top: 26px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        button {
            font: inherit; font-weight: 600;
            padding: 11px 24px;
            border-radius: 999px;
            border: 1px solid var(--btn-bg);
            background: var(--btn-bg);
            color: var(--btn-text);
            cursor: pointer;
            display: inline-flex; align-items: center; gap: 8px;
        }
        button:hover { opacity: 0.85; }
        button:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
        button[disabled] { opacity: 0.6; cursor: wait; }
        .spin { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; display: none; }
        button[disabled] .spin { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hint { margin-top: 18px; font-size: 0.85rem; }
        @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
    </style>
</head>
<body>
    <main class="card" role="alert">
        <div class="icon" aria-hidden="true">
            <!-- shown when offline -->
            <svg id="icon-offline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l20 20"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/><path d="M5 13a10 10 0 0 1 5.24-2.76"/><circle cx="12" cy="20" r="1" fill="currentColor"/></svg>
            <!-- shown when online but the server failed -->
            <svg id="icon-server" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01"/><path d="M14 6.5h3M14 17.5h3"/></svg>
        </div>
        <h1 id="title">You're offline</h1>
        <p id="message">It looks like you've lost your internet connection. Check your network and try again: the page will reload automatically once you're back online.</p>
        <div class="actions">
            <button id="retry" type="button"><span class="spin" aria-hidden="true"></span><span id="retry-label">Try again</span></button>
        </div>
        <p class="hint" id="hint" aria-live="polite"></p>
    </main>

    <script>
        (function () {
            var title = document.getElementById('title');
            var message = document.getElementById('message');
            var hint = document.getElementById('hint');
            var retry = document.getElementById('retry');
            var retryLabel = document.getElementById('retry-label');

            function render() {
                var offline = navigator.onLine === false;
                document.getElementById('icon-offline').hidden = !offline;
                document.getElementById('icon-server').hidden = offline;
                document.title = (offline ? "You're Offline" : 'Server Unavailable') + ' | Sufal K.C.';
                title.textContent = offline ? "You're offline" : 'Unable to reach the server';
                message.textContent = offline
                    ? "It looks like you've lost your internet connection. Check your network and try again: the page will reload automatically once you're back online."
                    : "The site isn't responding right now. This is usually temporary, so please try again in a moment.";
            }

            function tryAgain() {
                retry.disabled = true;
                retryLabel.textContent = 'Checking…';
                hint.textContent = '';
                // Probe the site first so we don't reload into the same error.
                fetch('/', { cache: 'no-store', method: 'HEAD' })
                    .then(function (res) {
                        if (res.ok) { location.reload(); return; }
                        throw new Error('status ' + res.status);
                    })
                    .catch(function () {
                        retry.disabled = false;
                        retryLabel.textContent = 'Try again';
                        hint.textContent = 'Still unreachable. Please try again shortly.';
                        render();
                    });
            }

            retry.addEventListener('click', tryAgain);
            window.addEventListener('online', function () { render(); tryAgain(); });
            window.addEventListener('offline', render);
            render();
        })();
    </script>
</body>
</html>
